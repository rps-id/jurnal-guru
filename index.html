<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Guru</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HALAMAN LOGIN ===== -->
  <div id="loginPage" class="page">
    <div class="login-box">
      <h1>Jurnal Guru</h1>
      <p>Masuk untuk mengakses jurnal mengajar kamu</p>
      <button id="loginBtn" class="btn-google">
        Login dengan Google
      </button>
      <p id="loginError" class="error-text"></p>
    </div>
  </div>

  <!-- ===== HALAMAN UTAMA (SETELAH LOGIN) ===== -->
  <div id="appPage" class="page" style="display:none;">
    <header>
      <h2>Jurnal Guru</h2>
      <div class="user-info">
        <span id="userEmail"></span>
        <button id="logoutBtn">Logout</button>
      </div>
    </header>

    <main>
      <!-- ===== TAMBAH KELAS ===== -->
      <section class="card">
        <h3>Tambah Kelas</h3>
        <div class="form-row">
          <input type="text" id="namaKelasInput" placeholder="Nama kelas (contoh: X IPA 1)">
          <input type="text" id="mapelKelasInput" placeholder="Mapel (contoh: Fisika)">
          <button id="tambahKelasBtn">Tambah Kelas</button>
        </div>
        <p id="kelasStatus" class="status-text"></p>
      </section>

      <!-- ===== DAFTAR KELAS ===== -->
      <section class="card">
        <h3>Kelas Saya</h3>
        <select id="kelasSelect">
          <option value="">-- Pilih kelas --</option>
        </select>
      </section>

      <!-- ===== IMPORT SISWA VIA EXCEL ===== -->
      <section class="card">
        <h3>Import Siswa (Excel)</h3>
        <p class="hint">Kolom yang dibutuhkan: <b>Nama</b>, <b>NIS</b></p>
        <button id="downloadTemplateBtn">Download Template Excel</button>
        <div class="form-row">
          <input type="file" id="excelFileInput" accept=".xlsx,.xls">
          <button id="importSiswaBtn">Import ke Kelas Terpilih</button>
        </div>
        <p id="importStatus" class="status-text"></p>
      </section>

      <!-- ===== DAFTAR SISWA ===== -->
      <section class="card">
        <h3>Daftar Siswa</h3>
        <table id="siswaTable">
          <thead>
            <tr><th>Nama</th><th>NIS</th></tr>
          </thead>
          <tbody id="siswaTableBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- ===== LIBRARY EXCEL (SheetJS) ===== -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- ===== FIREBASE SCRIPT ===== -->
  <script type="module" src="firebase-init.js"></script>
  <script type="module" src="kelola-kelas.js"></script>
</body>
</html>
